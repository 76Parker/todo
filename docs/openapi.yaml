openapi: 3.0.3
info:
  title: Todo API
  version: 2.0.0
  description: |
    HTTP API для работы со списком задач.

    В текущей реализации публично доступны операции:
    - создание задачи
    - чтение задачи по ID
    - поиск задач по `title`
    - частичное обновление задачи
    - добавление одного тега к задаче
    - удаление одного тега у задачи

    Важные нюансы контракта:
    - `X-Request-ID` можно передать в запросе. Если заголовок не указан, сервер сгенерирует его сам.
    - в `POST /v1/tasks` неизвестные поля JSON запрещены
    - в `PATCH /v1/tasks/{id}` и в операциях с тегами неизвестные поля сейчас не запрещены
    - некоторые поля запроса можно либо не передавать вовсе, либо передавать как `null`
    - в ответах `description` и `category` никогда не бывают `null`: сервер возвращает пустую строку `""`, если значение отсутствует
    - в ответах `tags` никогда не бывают `null`: сервер возвращает массив, обычно пустой `[]`, если тегов нет
servers:
  - url: /
tags:
  - name: Tasks
    description: Создание, чтение, поиск, обновление задач и работа с тегами
paths:
  /v1/tasks:
    get:
      tags:
        - Tasks
      summary: Найти задачи
      description: |
        Возвращает список задач.

        Сейчас поддерживается только один фильтр:
        - `title` — поиск/фильтрация по заголовку

        Если фильтр не передан, поведение определяется текущей реализацией сервиса поиска.
      operationId: queryTasks
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - in: query
          name: title
          required: false
          description: |
            Фильтр по заголовку задачи.

            Параметр необязателен. Пустая строка допустима.
          schema:
            type: string
      responses:
        "200":
          description: Список задач
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadTask"
              examples:
                found:
                  summary: Найдено несколько задач
                  value:
                    - id: 42
                      title: Buy milk
                      status: open
                      description: ""
                      category: ""
                      tags: []
                      created_at: "2026-05-20T12:00:00Z"
                    - id: 43
                      title: Buy bread
                      status: done
                      description: ""
                      category: home
                      tags:
                        - grocery
                      created_at: "2026-05-20T13:00:00Z"
                empty:
                  summary: Ничего не найдено
                  value: []
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Tasks
      summary: Создать задачу
      description: |
        Создаёт новую задачу.

        Особенности:
        - `title` и `status` обязательны
        - `description`, `category` и `tags` можно опустить
        - `description`, `category` и `tags` также можно передать как `null`
        - неизвестные поля JSON запрещены
      operationId: createTask
      parameters:
        - $ref: "#/components/parameters/XRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
            examples:
              minimal:
                summary: Минимальный запрос
                value:
                  title: Buy milk
                  status: open
              nullableOptionalFields:
                summary: Опциональные поля явно переданы как null
                value:
                  title: Buy milk
                  status: open
                  description: null
                  category: null
                  tags: null
              full:
                summary: Полный запрос
                value:
                  title: Prepare sprint board
                  status: in_progress
                  description: Review backlog and create tasks
                  category: work
                  tags:
                    - planning
                    - sprint
      responses:
        "201":
          description: Задача создана
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadTask"
              examples:
                created:
                  summary: Созданная задача
                  value:
                    id: 42
                    title: Buy milk
                    status: open
                    description: ""
                    category: ""
                    tags: []
                    created_at: "2026-05-20T12:00:00Z"
        "400":
          description: Некорректный JSON, ошибка валидации или невалидный статус
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidJson:
                  summary: Неизвестное поле или сломанный JSON
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: invalid json body
                validationError:
                  summary: Ошибка валидации DTO
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: validation_error
                    message: title is required
                invalidStatus:
                  summary: Статус не прошёл доменную валидацию
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: invalid status
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Получить задачу
      description: Возвращает задачу по её идентификатору.
      operationId: readTask
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - $ref: "#/components/parameters/XRequestID"
      responses:
        "200":
          description: Задача найдена
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadTask"
              examples:
                found:
                  value:
                    id: 42
                    title: Buy milk
                    status: open
                    description: ""
                    category: ""
                    tags: []
                    created_at: "2026-05-20T12:00:00Z"
        "400":
          description: Некорректный идентификатор задачи
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidTaskID:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: validation_error
                    message: invalid task_id
                emptyTaskID:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: validation_error
                    message: task_id is empty
        "404":
          description: Задача не найдена
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                taskNotFound:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 404
                    code: resource_not_found
                    message: task not found
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Tasks
      summary: Частично обновить задачу
      description: |
        Частично обновляет задачу по её идентификатору.

        Особенности текущей реализации:
        - все поля тела запроса необязательны
        - поля можно либо не передавать, либо передавать как `null`
        - если все поля отсутствуют или равны `null`, сервис может вернуть ошибку `no changes in update task request`
        - `description` и `category` можно очистить пустой строкой `""`
      operationId: updateTask
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - $ref: "#/components/parameters/XRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
            examples:
              title:
                summary: Обновление заголовка
                value:
                  title: Updated Title
              clearDescription:
                summary: Очистка описания
                value:
                  description: ""
              explicitNulls:
                summary: Поля переданы как null и будут трактоваться как отсутствующие
                value:
                  title: null
                  status: null
              full:
                summary: Обновление нескольких полей
                value:
                  title: Prepare release
                  status: in_progress
                  description: Finalize checklist
                  category: work
      responses:
        "200":
          description: Задача обновлена
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadTask"
              examples:
                updated:
                  value:
                    id: 42
                    title: Prepare release
                    status: in_progress
                    description: Finalize checklist
                    category: work
                    tags: []
                    created_at: "2026-05-20T12:00:00Z"
        "400":
          description: Некорректный JSON, ошибка валидации, невалидный статус или отсутствие изменений
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidJson:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: validation_error
                    message: unexpected EOF
                invalidTaskID:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: validation_error
                    message: invalid task_id
                invalidStatus:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: invalid status
                noChanges:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: no changes in update task request
        "404":
          description: Задача не найдена
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                taskNotFound:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 404
                    code: resource_not_found
                    message: task not found
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/tasks/{id}/tags:
    post:
      tags:
        - Tasks
      summary: Добавить тег к задаче
      description: |
        Добавляет один тег к задаче по её идентификатору.

        Особенности:
        - тело запроса принимает ровно одно поле `tag`
        - `tag` не может быть `null`
        - пустая строка и строка из одних пробелов невалидны
      operationId: addTaskTag
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - $ref: "#/components/parameters/XRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tag"
            examples:
              add:
                value:
                  tag: urgent
      responses:
        "200":
          description: Тег добавлен
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadTask"
              examples:
                updated:
                  value:
                    id: 42
                    title: Buy milk
                    status: open
                    description: ""
                    category: ""
                    tags:
                      - urgent
                    created_at: "2026-05-20T12:00:00Z"
        "400":
          description: Некорректный идентификатор, JSON или сам тег
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidID:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: invalid id
                invalidJson:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: invalid json body
                invalidTag:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: tag is required
        "404":
          description: Задача не найдена
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                taskNotFound:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 404
                    code: resource_not_found
                    message: task not found
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Tasks
      summary: Удалить тег у задачи
      description: |
        Удаляет один тег у задачи по её идентификатору.

        Особенности:
        - тело запроса принимает ровно одно поле `tag`
        - `tag` не может быть `null`
        - если сервис не смог найти ни задачу, ни тег, он сейчас возвращает единый ответ `tag or task not found`
      operationId: deleteTaskTag
      parameters:
        - $ref: "#/components/parameters/TaskID"
        - $ref: "#/components/parameters/XRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tag"
            examples:
              delete:
                value:
                  tag: urgent
      responses:
        "200":
          description: Тег удалён
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadTask"
              examples:
                updated:
                  value:
                    id: 42
                    title: Buy milk
                    status: open
                    description: ""
                    category: ""
                    tags: []
                    created_at: "2026-05-20T12:00:00Z"
        "400":
          description: Некорректный идентификатор, JSON или сам тег
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidID:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: invalid id
                invalidJson:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: invalid json body
                invalidTag:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 400
                    code: bad_request
                    message: tag is required
        "404":
          description: Задача или тег не найдены
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                taskOrTagNotFound:
                  value:
                    request_id: clx7f4b2f0000qtr8gk1d0abc
                    status_code: 404
                    code: resource_not_found
                    message: tag or task not found
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    XRequestID:
      in: header
      name: X-Request-ID
      required: false
      description: |
        Пользовательский request ID.

        Если не передан, сервер сгенерирует значение сам и вернёт его в ответе.
        Если передан слишком длинный идентификатор, сервер может заменить его на новый.
      schema:
        type: string
        maxLength: 128
    TaskID:
      in: path
      name: id
      required: true
      description: Идентификатор задачи
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    XRequestID:
      description: Идентификатор запроса, который сервер использовал при обработке
      schema:
        type: string
  responses:
    InternalServerError:
      description: Внутренняя ошибка сервера
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
  schemas:
    TaskStatus:
      type: string
      description: |
        Статус задачи.

        Допустимые значения определяются доменной моделью.
      enum:
        - open
        - in_progress
        - done
        - closed
    CreateTask:
      type: object
      additionalProperties: false
      required:
        - title
        - status
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Заголовок задачи.

            Обязательное поле. Пустая строка и строка из одних пробелов невалидны.
        status:
          allOf:
            - $ref: "#/components/schemas/TaskStatus"
          description: |
            Статус новой задачи.

            Обязательное поле.
        description:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
          description: |
            Описание задачи.

            Поле необязательное.
            Допустимы варианты:
            - поле отсутствует
            - поле равно `null`
            - поле содержит строку длиной от 1 до 500 символов
        category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
          description: |
            Категория задачи.

            Поле необязательное.
            Допустимы варианты:
            - поле отсутствует
            - поле равно `null`
            - поле содержит строку длиной от 1 до 500 символов
        tags:
          type: array
          nullable: true
          minItems: 1
          maxItems: 10
          description: |
            Список тегов.

            Поле необязательное.
            Допустимы варианты:
            - поле отсутствует
            - поле равно `null`
            - поле содержит от 1 до 10 тегов
          items:
            type: string
            minLength: 1
            maxLength: 30
            description: Один тег
    UpdateTask:
      type: object
      additionalProperties: true
      description: |
        Частичное обновление задачи.

        Все поля необязательны и могут отсутствовать.
        Все поля также допускают `null`, потому что в Go они представлены указателями.

        Важная особенность текущего сервиса:
        - `description` и `category` можно очистить пустой строкой `""`
        - если все поля отсутствуют или равны `null`, обновлять будет нечего
      properties:
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          description: |
            Новый заголовок задачи.

            Может отсутствовать или быть `null`.
            Пустая строка и строка из одних пробелов невалидны.
        status:
          allOf:
            - $ref: "#/components/schemas/TaskStatus"
          nullable: true
          description: |
            Новый статус задачи.

            Может отсутствовать или быть `null`.
        description:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Новое описание задачи.

            Может отсутствовать или быть `null`.
            Пустая строка `""` допустима и может использоваться для очистки значения.
        category:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Новая категория задачи.

            Может отсутствовать или быть `null`.
            Пустая строка `""` допустима и может использоваться для очистки значения.
    Tag:
      type: object
      additionalProperties: true
      required:
        - tag
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 30
          description: |
            Один тег для добавления или удаления.

            Поле обязательное.
            Значение `null` не поддерживается.
            Пустая строка и строка из одних пробелов невалидны.
    ReadTask:
      type: object
      required:
        - id
        - title
        - status
        - description
        - category
        - tags
        - created_at
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор задачи
        title:
          type: string
          description: Заголовок задачи
        status:
          allOf:
            - $ref: "#/components/schemas/TaskStatus"
          description: Текущий статус задачи
        description:
          type: string
          nullable: false
          description: |
            Описание задачи.

            В ответе это поле никогда не равно `null`.
            Если описание отсутствует в хранилище, сервер возвращает пустую строку `""`.
        category:
          type: string
          nullable: false
          description: |
            Категория задачи.

            В ответе это поле никогда не равно `null`.
            Если категория отсутствует в хранилище, сервер возвращает пустую строку `""`.
        tags:
          type: array
          nullable: false
          description: |
            Список тегов задачи.

            В ответе это поле никогда не равно `null`.
            Если тегов нет, сервер обычно возвращает пустой массив `[]`.
          items:
            type: string
        created_at:
          type: string
          format: date-time
          description: Время создания задачи в формате RFC3339
    Error:
      type: object
      required:
        - request_id
        - status_code
        - code
        - message
      properties:
        request_id:
          type: string
          description: Request ID, использованный сервером
        status_code:
          type: integer
          format: int32
          description: HTTP статус-код
        code:
          type: string
          description: Машинно-читаемый код ошибки
          enum:
            - bad_request
            - validation_error
            - resource_not_found
        message:
          type: string
          description: Человекочитаемое описание ошибки
